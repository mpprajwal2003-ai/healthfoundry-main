<style>
.vring{cursor:pointer;transition:opacity .2s}.vring:hover{opacity:.82}
</style>
<svg width="100%" viewBox="0 0 680 640" role="img">
<title>HealthFoundry mission, pillars and values</title>
<desc>Five mission pillars form a complete ring around the central mission circle. Four value circles sit at top, right, bottom and left cardinal positions.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Outer orbit ring -->
<circle cx="340" cy="310" r="210" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.75" stroke-dasharray="3 5"/>

<!-- ══ PILLAR RING ══ -->
<!-- Seg 1: Unify  236°→306° -->
<g class="vring c-purple" onclick="sendPrompt('Tell me about the Unify pillar at HealthFoundry')">
  <path stroke-width="0.75" d="M 286.4,230.4 A 96,96 0 0,1 396.5,232.3 L 418.8,203.5 A 132,132 0 0,0 265.2,201.0 Z"/>
  <text class="ts" x="340" y="207" text-anchor="middle" dominant-baseline="central">Unify</text>
</g>

<!-- Seg 2: Intelligence  308°→018° -->
<g class="vring c-purple" onclick="sendPrompt('Tell me about the Intelligence pillar at HealthFoundry')">
  <path stroke-width="0.75" d="M 399.1,234.3 A 96,96 0 0,1 431.3,339.7 L 465.9,351.3 A 132,132 0 0,0 421.2,206.3 Z"/>
  <text class="ts" x="448" y="271" text-anchor="middle" dominant-baseline="central">Intelligence</text>
</g>

<!-- Seg 3: Reliable  020°→090° -->
<g class="vring c-purple" onclick="sendPrompt('Tell me about the Reliable pillar at HealthFoundry')">
  <path stroke-width="0.75" d="M 430.2,342.8 A 96,96 0 0,1 340,406 L 340,442 A 132,132 0 0,0 463.9,355.7 Z"/>
  <text class="ts" x="420" y="402" text-anchor="middle" dominant-baseline="central">Reliable</text>
</g>

<!-- Seg 4: Frictionless  092°→162° -->
<g class="vring c-purple" onclick="sendPrompt('Tell me about the Frictionless pillar at HealthFoundry')">
  <path stroke-width="0.75" d="M 336.6,405.9 A 96,96 0 0,1 248.7,339.7 L 214.1,351.3 A 132,132 0 0,0 335.5,442.0 Z"/>
  <text class="ts" x="260" y="402" text-anchor="middle" dominant-baseline="central">Frictionless</text>
</g>

<!-- Seg 5: Scale  164°→234° -->
<g class="vring c-purple" onclick="sendPrompt('Tell me about the Scale pillar at HealthFoundry')">
  <path stroke-width="0.75" d="M 247.7,336.5 A 96,96 0 0,1 283.5,232.3 L 265.2,201.0 A 132,132 0 0,0 214.1,351.3 Z"/>
  <text class="ts" x="232" y="271" text-anchor="middle" dominant-baseline="central">Scale</text>
</g>

<!-- ══ SPOKES ══ -->
<line x1="340" y1="214" x2="340" y2="148" stroke="var(--color-border-tertiary)" stroke-width="0.75"/>
<line x1="436" y1="310" x2="472" y2="310" stroke="var(--color-border-tertiary)" stroke-width="0.75"/>
<line x1="340" y1="406" x2="340" y2="468" stroke="var(--color-border-tertiary)" stroke-width="0.75"/>
<line x1="244" y1="310" x2="208" y2="310" stroke="var(--color-border-tertiary)" stroke-width="0.75"/>

<!-- ══ VALUE CIRCLES ══ -->

<!-- Top: Shared goals -->
<g class="vring c-teal" onclick="sendPrompt('Tell me more about Shared goals at HealthFoundry')">
  <circle cx="340" cy="86" r="62" stroke-width="0.75"/>
  <text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">Shared goals</text>
  <text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">Your success</text>
  <text class="ts" x="340" y="102" text-anchor="middle" dominant-baseline="central">is our success</text>
</g>

<!-- Right: Extreme ownership -->
<g class="vring c-teal" onclick="sendPrompt('Tell me more about Extreme ownership at HealthFoundry')">
  <circle cx="536" cy="310" r="62" stroke-width="0.75"/>
  <text class="th" x="536" y="292" text-anchor="middle" dominant-baseline="central">Extreme</text>
  <text class="th" x="536" y="308" text-anchor="middle" dominant-baseline="central">ownership</text>
  <text class="ts" x="536" y="326" text-anchor="middle" dominant-baseline="central">We close the loop</text>
</g>

<!-- Bottom: Rapid time to value -->
<g class="vring c-teal" onclick="sendPrompt('Tell me more about Rapid time to value at HealthFoundry')">
  <circle cx="340" cy="532" r="62" stroke-width="0.75"/>
  <text class="th" x="340" y="514" text-anchor="middle" dominant-baseline="central">Rapid time</text>
  <text class="th" x="340" y="530" text-anchor="middle" dominant-baseline="central">to value</text>
  <text class="ts" x="340" y="548" text-anchor="middle" dominant-baseline="central">8 weeks, not months</text>
</g>

<!-- Left: Craftsmanship -->
<g class="vring c-teal" onclick="sendPrompt('Tell me more about Craftsmanship at HealthFoundry')">
  <circle cx="144" cy="310" r="62" stroke-width="0.75"/>
  <text class="th" x="144" y="298" text-anchor="middle" dominant-baseline="central" font-size="13">Craftsmanship</text>
  <text class="ts" x="144" y="316" text-anchor="middle" dominant-baseline="central">Reliability &amp; delight</text>
</g>

<!-- ══ CENTRE: Mission ══ -->
<g class="c-purple">
  <circle cx="340" cy="310" r="92" stroke-width="1"/>
  <text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central">Our mission</text>
  <text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central">Building the system of</text>
  <text class="ts" x="340" y="326" text-anchor="middle" dominant-baseline="central">intelligence for healthcare</text>
</g>

<!-- ══ BYLINE ══ -->
<line x1="190" y1="608" x2="490" y2="608" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="340" y="628" text-anchor="middle">Built by people who know healthcare from the inside.</text>
</svg>
