name: Trigger FinOps Sync in healthfoundryai-finops

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/data/solutions-finops.md'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to healthfoundryai-finops
        run: |
          TOKEN="${{ secrets.CROSS_REPO_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.SYNC_PAT }}"
          fi

          if [ -z "$TOKEN" ]; then
            echo "::error::Neither CROSS_REPO_PAT nor SYNC_PAT secret is set in repository settings."
            exit 1
          fi

          echo "Triggering solutions-finops-updated event in mpprajwal2003-ai/healthfoundryai-finops..."
          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/mpprajwal2003-ai/healthfoundryai-finops/dispatches \
            -d '{"event_type":"solutions-finops-updated"}')

          http_code="${response: -3}"
          if [ "$http_code" -eq 204 ]; then
            echo "Successfully dispatched solutions-finops-updated event to healthfoundryai-finops!"
          else
            echo "::error::Failed to dispatch event. HTTP status code: $http_code"
            exit 1
          fi
