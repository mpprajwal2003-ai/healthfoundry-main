name: Sync FinOps Markdown to healthfoundryai-finops

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/data/solutions-finops.md'
  workflow_dispatch:

jobs:
  sync-file:
    runs-on: ubuntu-latest
    steps:
      - name: Check for SYNC_PAT secret
        id: check_token
        run: |
          if [ -z "${{ secrets.SYNC_PAT }}" ]; then
            echo "has_pat=false" >> $GITHUB_OUTPUT
            echo "::warning::SYNC_PAT secret is not configured in repository settings. Automatic git push to healthfoundryai-finops requires a Personal Access Token named SYNC_PAT."
          else
            echo "has_pat=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout healthfoundry-main
        if: steps.check_token.outputs.has_pat == 'true'
        uses: actions/checkout@v4

      - name: Checkout healthfoundryai-finops target repository
        if: steps.check_token.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'mpprajwal2003-ai/healthfoundryai-finops'
          token: ${{ secrets.SYNC_PAT }}
          path: 'target-repo'


      - name: Copy updated solutions-finops.md
        if: steps.check_token.outputs.has_pat == 'true'
        run: |
          mkdir -p target-repo/src/data
          cp src/data/solutions-finops.md target-repo/src/data/solutions-finops.md

      - name: Commit and push changes to healthfoundryai-finops
        if: steps.check_token.outputs.has_pat == 'true'
        run: |

          cd target-repo
          git config user.name "GitHub Action Sync Bot"
          git config user.email "action@github.com"
          git add src/data/solutions-finops.md
          if git diff --staged --quiet; then
            echo "No changes in solutions-finops.md to commit."
          else
            git commit -m "AUTOMATED SYNC: Update solutions-finops.md from healthfoundry-main"
            git push
          fi
